<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="100%" height="100%" style="background:#0A1128; border-radius:12px;">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Scanner Framing Brackets -->
    <path d="M 35,20 L 20,20 L 20,35" fill="none" stroke="#00F0FF" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 125,20 L 140,20 L 140,35" fill="none" stroke="#00F0FF" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 140,125 L 140,140 L 125,140" fill="none" stroke="#6366F1" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 20,125 L 20,140 L 35,140" fill="none" stroke="#6366F1" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Central Isometric Box -->
    <polygon points="80,30 128,58 128,102 80,130 32,102 32,58" fill="none" stroke="url(#iconGrad)" stroke-width="5.5" stroke-linejoin="round"/>
    <path d="M 80,30 L 80,80 M 128,58 L 80,80 M 32,58 L 80,80" fill="none" stroke="#00F0FF" stroke-width="3.5"/>
    <path d="M 80,80 L 80,130 M 80,80 L 128,102 M 80,80 L 32,102" fill="none" stroke="#6366F1" stroke-width="3.5" stroke-dasharray="4 4"/>

    <!-- High-Contrast Nodes -->
    <circle cx="80" cy="30" r="5.5" fill="#00F0FF"/>
    <circle cx="128" cy="58" r="5.5" fill="#00F0FF"/>
    <circle cx="128" cy="102" r="5.5" fill="#6366F1"/>
    <circle cx="80" cy="130" r="5.5" fill="#6366F1"/>
    <circle cx="32" cy="102" r="5.5" fill="#6366F1"/>
    <circle cx="32" cy="58" r="5.5" fill="#00F0FF"/>
    <circle cx="80" cy="80" r="7" fill="#FFFFFF"/>
  </g>
</svg>
